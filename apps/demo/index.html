<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Stream Uploader Demo</title>
    <style>
      :root {
        --bg: #fafaf9;
        --card-bg: #ffffff;
        --text-main: #1c1917;
        --text-muted: #78716c;
        --primary: #44403c;
        --primary-hover: #292524;
        --success: #166534;
        --error: #991b1b;
        --border: #e7e5e4;
        --border-hover: #d6d3d1;
      }
      body {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        line-height: 1.6;
        max-width: 1000px;
        margin: 0 auto;
        padding: 80px 24px;
        background-color: var(--bg);
        color: var(--text-main);
        letter-spacing: -0.01em;
      }
      h1 { 
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 0.75rem;
        text-align: center;
        color: var(--text-main);
      }
      .subtitle {
        text-align: center;
        color: var(--text-muted);
        font-size: 1.125rem;
        margin-bottom: 5rem;
        font-weight: 400;
      }
      .card {
        background: var(--card-bg);
        padding: 2.5rem;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        margin-bottom: 2rem;
        transition: border-color 0.2s ease;
      }
      .upload-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }
      @media (max-width: 868px) {
        .upload-grid { grid-template-columns: 1fr; }
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: none;
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-primary {
        background-color: var(--primary);
        color: #fafaf9;
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
      }
      .btn-outline {
        background-color: white;
        border: 1px solid var(--border);
        color: var(--text-main);
      }
      .btn-outline:hover:not(:disabled) {
        border-color: var(--border-hover);
        background-color: var(--bg);
      }
      .progress-container {
        width: 100%;
        background-color: #f5f5f4;
        border-radius: 999px;
        height: 6px;
        margin-top: 1.5rem;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 999px;
      }
      .tag {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1.25rem;
        background: #f5f5f4;
        color: #57534e;
        border: 1px solid #e7e5e4;
      }
      .tag-stream {
        background: #f0f9ff;
        color: #0369a1;
        border-color: #e0f2fe;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
